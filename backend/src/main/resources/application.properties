spring.application.name=hospital-resource-allocation
server.port=${PORT:8080}

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# CareGrid Security, Token & CORS Configuration
caregrid.jwt.secret=${CAREGRID_JWT_SECRET:CareGridSecureJwtSecretKeyForHospitalResourceAllocationSystem2026!}
caregrid.jwt.expiration-ms=${CAREGRID_JWT_EXPIRATION_MS:86400000}
caregrid.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
